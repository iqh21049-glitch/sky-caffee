p4qki5IAAAAA==') center/cover;border-radius:25px;padding:38px 28px;color:white;box-shadow:var(--shadow);min-height:230px;display:flex;align-items:center}.hero h1{font-size:clamp(32px,6vw,55px);line-height:1.15;margin:0 0 10px}.hero p{margin:0 0 20px;color:#e8f7ff}.heroActions{display:flex;gap:9px;flex-wrap:wrap}.btn{display:inline-flex;align-items:center;justify-content:center;border:1px solid #ffffff80;border-radius:30px;padding:10px 17px;background:#ffffff20;color:white;font-weight:700;font-size:14px;cursor:pointer}.btn.primary{background:#fff;color:var(--blue);border-color:white}

.section{margin:28px auto}.sectionHead{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:14px}.sectionHead h2{margin:0;color:var(--deep);font-size:24px}.sectionHead p{margin:0;color:var(--muted);font-size:13px}
.categoryGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.category{background:#fff;border:1px solid var(--line);border-radius:19px;overflow:hidden;box-shadow:var(--shadow);transition:transform .18s}.category:hover{transform:translateY(-3px)}.category img{width:100%;height:155px;object-fit:cover;display:block}.categoryBody{padding:13px 15px}.categoryBody h3{margin:0;color:var(--blue);font-size:18px}.categoryBody p{margin:3px 0 0;color:var(--muted);font-size:12px}
.menuPanel{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:var(--shadow);margin-bottom:14px}.menuPanel h3{margin:0 0 12px;color:var(--blue);font-size:19px}.items{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 22px}.item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed #dceaf1;min-width:0}.item:last-child{border-bottom:0}.itemName{font-size:14px}.price{white-space:nowrap;color:var(--blue);font-size:13px;font-weight:800}.note{font-size:12px;color:var(--muted);margin:8px 0 0}
.subnav{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}.subnav a{border:1px solid var(--line);background:#f0f9ff;border-radius:24px;padding:7px 12px;font-size:13px;color:var(--blue)}
.contactGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.contactCard{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow)}.contactCard h3{margin:0 0 8px;color:var(--blue)}.contactCard p{margin:5px 0;font-size:14px}.contactCard a.link{color:#12699e;text-decoration:underline;text-underline-offset:3px;overflow-wrap:anywhere}
.booking{background:linear-gradient(135deg,#164e78,#267ca9);color:white;border-radius:22px;padding:22px;box-shadow:var(--shadow)}.booking h2{margin:0 0 5px}.booking p{margin:0 0 14px;color:#e2f5ff;font-size:14px}.formGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.formGrid input,.formGrid select,.formGrid textarea{width:100%;padding:12px;border:1px solid #ffffff80;border-radius:11px;background:#fff;color:#17364a;outline:none}.formGrid textarea{grid-column:1/-1;min-height:80px;resize:vertical}.booking .btn{margin-top:12px;background:#fff;color:var(--blue);border:0}
footer{text-align:center;padding:30px 0 38px;color:var(--muted);font-size:13px}.footerBrand{font-family:Georgia,serif;font-style:italic;color:var(--blue);font-size:24px;font-weight:bold}

/* Sky Caffee — modern visual refresh */
:root{--sky:#dff4ff;--sky2:#f4fbff;--blue:#123f61;--deep:#092b45;--cream:#fffaf2;--ink:#15364c;--muted:#637d8e;--line:#d7e8f1;--shadow:0 18px 45px rgba(9,43,69,.10)}
html{scroll-padding-top:100px}
body{background:radial-gradient(ellipse at 8% 8%,rgba(94,190,232,.22),transparent 30%),radial-gradient(ellipse at 92% 22%,rgba(255,205,130,.20),transparent 26%),linear-gradient(145deg,#eaf8ff 0%,#f7fbff 46%,#fff8ed 100%);background-attachment:fixed}
body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;opacity:.22;background-image:radial-gradient(#6da9c7 0.7px,transparent .7px);background-size:24px 24px}
header{background:rgba(248,253,255,.82);border-bottom:1px solid rgba(142,190,213,.35);box-shadow:0 5px 24px rgba(14,63,91,.06)}
.brand{font-size:25px;letter-spacing:.3px;text-shadow:0 2px 12px rgba(30,105,145,.10)}
nav a{background:rgba(255,255,255,.72);border-color:rgba(120,175,202,.32);box-shadow:0 4px 14px rgba(18,63,97,.05);transition:all .2s ease}
nav a:hover,nav a:focus-visible{background:var(--blue);color:#fff;transform:translateY(-2px)}
.hero{padding-top:38px}
.heroBox{position:relative;overflow:hidden;border:1px solid rgba(255,255,255,.42);border-radius:30px;box-shadow:0 24px 60px rgba(7,43,68,.22);background-blend-mode:normal}
.heroBox:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(5,34,56,.22),transparent 72%),radial-gradient(circle at 88% 15%,rgba(255,255,255,.23),transparent 22%)}
.heroBox>div{position:relative;z-index:1}
.hero h1{text-shadow:0 4px 22px rgba(0,0,0,.22);letter-spacing:-.7px}
.hero p{font-size:16px}
.btn{transition:transform .2s,box-shadow .2s,background .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 9px 22px rgba(4,31,51,.18)}
.quick a{position:relative;overflow:hidden;background:linear-gradient(145deg,rgba(255,255,255,.96),rgba(235,248,255,.88));border:1px solid rgba(126,180,207,.35);border-radius:18px;box-shadow:0 10px 26px rgba(16,67,96,.08);transition:transform .2s,box-shadow .2s}
.quick a:before{content:"";position:absolute;inset:auto -20% -55% -20%;height:90%;background:radial-gradient(ellipse,rgba(104,190,228,.20),transparent 68%)}
.quick a:hover{transform:translateY(-4px);box-shadow:0 16px 32px rgba(16,67,96,.13)}
.section{position:relative;margin:34px auto;padding:22px;border:1px solid rgba(144,190,211,.25);border-radius:26px;background:rgba(255,255,255,.48);box-shadow:0 12px 35px rgba(20,69,96,.045);backdrop-filter:blur(8px)}
.sectionHead{margin-bottom:19px}
.sectionHead h2{font-size:clamp(22px,3vw,28px);letter-spacing:-.4px}
.sectionHead h2:after{content:"";display:block;width:54px;height:4px;margin-top:7px;border-radius:9px;background:linear-gradient(90deg,#2b83ad,#f0bd75)}
.category{border:1px solid rgba(134,180,202,.34);border-radius:22px;background:rgba(255,255,255,.94);box-shadow:0 12px 28px rgba(10,54,80,.09);transition:transform .25s,box-shadow .25s,border-color .25s}
.category:hover{transform:translateY(-6px);box-shadow:0 20px 38px rgba(10,54,80,.15);border-color:#8dc6df}
.category img{height:180px;transition:transform .45s;}
.category:hover img{transform:scale(1.035)}
.categoryBody{position:relative;background:linear-gradient(180deg,#fff,#f5fbff);padding:15px 17px}
.categoryBody h3{font-size:18px}
.menuPanel{border:1px solid rgba(133,183,207,.38);border-radius:22px;background:linear-gradient(145deg,rgba(255,255,255,.98),rgba(241,249,253,.96));box-shadow:0 14px 32px rgba(12,57,83,.08);padding:22px}
.menuPanel h3{padding-bottom:10px;border-bottom:1px solid #dcebf2}
.item{padding:11px 2px;border-bottom-color:#dceaf1}
.price{background:#e8f6fc;border:1px solid #d3eaf5;border-radius:20px;padding:3px 11px}
.subnav a{background:rgba(255,255,255,.86);border-color:#cfe5ef;box-shadow:0 4px 12px rgba(18,63,97,.05)}
.booking{position:relative;overflow:hidden;border:1px solid rgba(255,255,255,.45);border-radius:28px;padding:clamp(22px,4vw,34px);background:radial-gradient(circle at 95% 5%,rgba(255,255,255,.22),transparent 26%),radial-gradient(circle at 5% 100%,rgba(114,202,231,.24),transparent 30%),linear-gradient(135deg,#092f4d 0%,#145b80 55%,#237da0 100%);box-shadow:0 22px 48px rgba(8,48,73,.22)}
.booking:after{content:"✦";position:absolute;left:26px;top:12px;font-size:90px;line-height:1;color:rgba(255,255,255,.08);pointer-events:none}
.booking h2{font-size:clamp(23px,3vw,30px);position:relative;z-index:1}
.booking p{position:relative;z-index:1;font-size:14px}
.formGrid{position:relative;z-index:1;gap:12px}
.formGrid input,.formGrid select,.formGrid textarea{border:1px solid rgba(255,255,255,.65);border-radius:14px;padding:13px 14px;background:rgba(255,255,255,.96);box-shadow:inset 0 1px 2px rgba(10,45,65,.04);transition:border-color .2s,box-shadow .2s}
.formGrid input:focus,.formGrid select:focus,.formGrid textarea:focus{outline:none;border-color:#8bd7f5;box-shadow:0 0 0 4px rgba(139,215,245,.2)}
.booking .btn{position:relative;z-index:1;border-radius:14px;padding:12px 20px;font-weight:800;box-shadow:0 8px 18px rgba(0,0,0,.12)}
.contactCard{border:1px solid rgba(132,180,202,.35);border-radius:20px;background:linear-gradient(145deg,#fff, #f1f9fd);box-shadow:0 12px 28px rgba(10,54,80,.07);padding:20px;transition:transform .2s}
.contactCard:hover{transform:translateY(-3px)}
footer{padding:38px 0 44px}
@media(max-width:760px){.section{padding:16px;border-radius:21px;margin:24px auto}.category img{height:145px}.hero{padding-top:22px}.heroBox{border-radius:23px}.quick{gap:9px}.quick a{padding:13px 8px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important}}

</style>
</head>
<body>
<header><div class="wrap top"><a class="brand" href="index.html"><span>Sky</span> Caffee ☁</a><nav aria-label="القائمة الرئيسية">
<a href="index.html">الرئيسية</a><a href="index.html#menu">المنيو</a><a href="booking.html" aria-current="page">حجز المباريات</a><a href="index.html#contact">اتصل بنا</a></nav></div></header>
<main class="wrap">
<section class="section" style="margin-top:34px">
<div class="sectionHead"><h2>حجز طاولات المباريات</h2><p>احجز مكانك لمتابعة المباراة في Sky Caffee</p></div>
<section id="booking" class="section"><div class="booking"><h2>حجوزات طاولات المباريات ⚽</h2><p>عبّي التفاصيل واضغط إرسال الحجز، وراح تنفتح رسالة واتساب جاهزة للتأكيد.</p>
<div class="formGrid"><input id="guest" placeholder="اسمك" autocomplete="name"><input id="phone" placeholder="رقم هاتفك" inputmode="tel"><input id="match" placeholder="المباراة / الفريقين"><input id="date" type="date"><select id="people"><option value="2 أشخاص">2 أشخاص</option><option value="3 أشخاص">3 أشخاص</option><option value="4 أشخاص">4 أشخاص</option><option value="5 أشخاص">5 أشخاص</option><option value="6 أشخاص أو أكثر">6 أشخاص أو أكثر</option></select><input id="time" type="time"><textarea id="extra" placeholder="ملاحظات إضافية (اختياري)"></textarea></div>
<button class="btn" type="button" onclick="sendBooking()">إرسال طلب الحجز عبر واتساب</button></div></section>
</section>
</main>
<footer><div class="footerBrand">Sky Caffee</div><div>أهلاً وسهلاً بكم دائماً ☁</div><div>© Sky Caffee</div></footer>
<script>
function sendBooking(){
 const val=id=>document.getElementById(id).value.trim();
 const name=val('guest'), phone=val('phone'), match=val('match'), date=val('date'), people=val('people'), time=val('time'), extra=val('extra');
 if(!name||!match||!date||!time){alert('يرجى ملء الاسم والمباراة والتاريخ والوقت.');return;}
 const msg=`طلب حجز طاولة - Sky Caffee%0Aالاسم: ${encodeURIComponent(name)}%0Aرقم الهاتف: ${encodeURIComponent(phone||'غير محدد')}%0Aالمباراة: ${encodeURIComponent(match)}%0Aالتاريخ: ${encodeURIComponent(date)}%0Aالوقت: ${encodeURIComponent(time)}%0Aعدد الأشخاص: ${encodeURIComponent(people)}%0Aملاحظات: ${encodeURIComponent(extra||'لا توجد')}`;
 window.open('https://wa.me/9647831797193?text='+msg,'_blank','noopener');
}
</script>
